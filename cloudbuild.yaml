# Build và deploy cả hai service lên Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1
substitutions:
  _REGION: asia-southeast1
  # Nhãn ảnh container. Phải là biến tự đặt (_TAG), KHÔNG dùng SHORT_SHA:
  # SHORT_SHA chỉ có giá trị khi build được kích hoạt từ kho mã đã kết nối.
  # Với `gcloud builds submit` (tải mã từ máy lên) biến đó rỗng, làm nhãn ảnh
  # kết thúc bằng dấu ":" và Docker báo "invalid reference format" ngay bước đầu.
  _TAG: latest
  _API_SERVICE: aiedu365-api
  _WEB_SERVICE: aiedu365-web
  _REPO: aiedu365
  _SITE_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}'

steps:
  # 1. Build API
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - api/Dockerfile
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}'
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}']
    waitFor: ['build-api']

  # 2. Deploy API trước, để lấy URL nội bộ cho bước build web
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=aiedu365-api@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=ENVIRONMENT=production,USE_FIRESTORE=true,LLM_PROVIDER=vertex,GCP_PROJECT=$PROJECT_ID,GCP_LOCATION=${_REGION}
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
    waitFor: ['push-api']

  # 3. Lấy URL nội bộ của API vừa deploy, ghi ra file dùng chung giữa các bước
  - id: resolve-api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run services describe ${_API_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/api_url.txt
        echo "API nội bộ: $(cat /workspace/api_url.txt)"
    waitFor: ['deploy-api']

  # 4. Build web. URL nội bộ được nhúng vào cấu hình proxy lúc build, nên phải
  #    có API trước. Dùng builder docker chính thức thay vì gọi docker từ image
  #    cloud-sdk — image đó không bảo đảm có sẵn docker CLI.
  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker build -f web/Dockerfile \
          --build-arg API_INTERNAL_URL="$(cat /workspace/api_url.txt)" \
          --build-arg NEXT_PUBLIC_SITE_URL="${_SITE_URL}" \
          -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}' .
    waitFor: ['resolve-api-url']

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}']
    waitFor: ['build-web']

  # 5. Deploy web — service duy nhất mở ra Internet
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=aiedu365-web@$PROJECT_ID.iam.gserviceaccount.com
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
    waitFor: ['push-web']
