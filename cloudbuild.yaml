# Build và deploy cả hai service lên Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1
substitutions:
  _REGION: asia-southeast1
  _API_SERVICE: aiedu365-api
  _WEB_SERVICE: aiedu365-web
  _REPO: aiedu365
  _SITE_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA'

steps:
  # 1. Build API
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - api/Dockerfile
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA'
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA']
    waitFor: ['build-api']

  # 2. Deploy API trước, để lấy URL nội bộ cho bước build web
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=aiedu365-api@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=ENVIRONMENT=production,USE_FIRESTORE=true,LLM_PROVIDER=vertex,GCP_PROJECT=$PROJECT_ID,GCP_LOCATION=${_REGION}
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
    waitFor: ['push-api']

  # 3. Build web với URL nội bộ của API vừa deploy
  - id: build-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        API_URL="$(gcloud run services describe ${_API_SERVICE} \
          --region=${_REGION} --format='value(status.url)')"
        echo "API nội bộ: $$API_URL"
        docker build -f web/Dockerfile \
          --build-arg API_INTERNAL_URL="$$API_URL" \
          --build-arg NEXT_PUBLIC_SITE_URL="${_SITE_URL}" \
          -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA' .
    waitFor: ['deploy-api']

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA']
    waitFor: ['build-web']

  # 4. Deploy web — service duy nhất mở ra Internet
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=aiedu365-web@$PROJECT_ID.iam.gserviceaccount.com
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
    waitFor: ['push-web']
